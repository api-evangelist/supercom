aid: supercom
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/supercom.png
name: Super.com
description: 'Super.com (formerly SnapTravel and Snapcommerce) is a consumer savings company founded
  in 2016 by Hussein Fazal and Henry Shi, headquartered in San Francisco with engineering roots in
  Toronto. Its app bundles SuperTravel hotel booking, flights, SuperShop savings, SuperCash cash back
  and credit building, SuperPay, and SuperRx prescription discounts, and the company reports more than
  $2 billion in sales processed since launch on roughly $150 million raised across seed through Series C.
  Its only developer-facing surface is the SnapTravel Partner Search API at api.snaptravel.com — a hotel
  search-and-book integration offered to business partners. No public API reference, developer portal,
  or machine-readable specification is published: every documentation path on the API host returns 404,
  no developer/docs subdomain resolves, and the www.super.com HTML surface is served behind a Cloudflare
  bot challenge. The company does publish an RFC 9116 security.txt naming a security contact and an
  invite-only Bugcrowd program.'
